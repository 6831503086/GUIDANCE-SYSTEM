spring.application.name=guidance-system

# H2 file-based database (data stays after restarting)
spring.datasource.url=jdbc:h2:file:./data/guidance_db
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# H2 database console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Email configuration (Gmail SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_APP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Email verification link
app.verification.base-url=${APP_VERIFICATION_BASE_URL:http://localhost:8080}


# JWT settings
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=3600000

spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB
