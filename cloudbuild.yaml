steps:
  # Step 1: สร้าง image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'us-central1-docker.pkg.dev/$_PROJECT_ID/webdev-dockers/guidance-system:$COMMIT_SHA', '.']

  # Step 2: เอา image เก็บเข้าตู้ Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'us-central1-docker.pkg.dev/$_PROJECT_ID/webdev-dockers/guidance-system:$COMMIT_SHA']

  # Step 3: ส่งไปรันที่ Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'guidance-system'
      - '--image=us-central1-docker.pkg.dev/$_PROJECT_ID/webdev-dockers/guidance-system:$COMMIT_SHA'
      - '--region=us-central1'
      - '--platform=managed'
      - '--port=8080'
      - '--allow-unauthenticated'

images:
  - 'us-central1-docker.pkg.dev/$_PROJECT_ID/webdev-dockers/guidance-system:$COMMIT_SHA'

substitutions:
  _PROJECT_ID: 'guidance-teacher-system'

options:
  logging: CLOUD_LOGGING_ONLY